x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE}
    max-file: ${LOG_MAX_FILE}
    compress: ${LOG_COMPRESS}
services:
  vaultisse:
    container_name: vaultisse
    image: ${IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SESSION_TIME: ${SESSION_TIME}
      MAX_SESSION_AGE_DAYS: ${MAX_SESSION_AGE_DAYS}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED}
      TZ: ${TZ}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${API_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      FRONT_END_URL: ${FRONT_END_URL}
      TRUST_PROXY: ${TRUST_PROXY}
      ALLOW_HTTP: ${ALLOW_HTTP}
      DB_HOST: vaultisse-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set in .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM}
      OIDC_PERSONAL_VAULT: ${OIDC_PERSONAL_VAULT}
      SSO_ONLY: ${SSO_ONLY}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS}
    volumes:
      - vaultisse-logs:/app/logs
      - step-ca-vhost:/vhost.d
      - type: volume
        source: step-ca-data
        target: /step-ca-root
        read_only: true
        volume:
          subpath: certs
    networks:
      - vaultisse-network
      - step-ca-network
    configs:
      - source: vhost
        target: ${VHOST_PATH}
    depends_on:
      vaultisse-db:
        condition: service_healthy
networks:
  vaultisse-network:
    name: vaultisse-network
    driver: bridge
  step-ca-network:
    name: step-ca-network
    external: true
volumes:
  vaultisse-logs:
    name: vaultisse-logs
  step-ca-vhost:
    external: true
  step-ca-data:
    external: true
configs:
  vhost:
    content: |
      client_max_body_size 0;
