services:
  vaultisse:
    environment:
      # SSO activates only when all four OIDC_* core vars are non-empty
      # (AppService.__readOidcConfig); otherwise the app stays password-only.
      OIDC_ISSUER: ${OIDC_ISSUER:-https://kanidm.af/oauth2/openid/vaultisse}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-vaultisse}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set in .env}
      # Must match a redirect URL registered on the kanidm client.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://vaultisse.af/auth/oidc/callback}
      # The `groups` scope makes kanidm emit the groups claim (SPN form).
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      # false = SSO users get a personal vault on first login; with true,
      # vault access comes from the per-vault group-role mapping in the app.
      OIDC_PERSONAL_VAULT: ${OIDC_PERSONAL_VAULT:-true}
      # true = password login/registration off; the IdP is the only way in.
      SSO_ONLY: ${SSO_ONLY:-false}
