services:
  vaultisse:
    environment:
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/step-ca-root/root_ca.crt}
    volumes:
      - type: volume
        source: step-ca-data
        target: /step-ca-root
        read_only: true
        volume:
          subpath: certs

volumes:
  step-ca-data:
    external: true
